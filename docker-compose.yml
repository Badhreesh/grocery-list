services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: badhreesh
      POSTGRES_PASSWORD: cuddles
      POSTGRES_DB: groceries
    ports:
      - "5432:5432"
    volumes:
      - groceries_data:/var/lib/postgresql/data
  
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://badhreesh:cuddles@db:5432/groceries
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - .:/backend

volumes:
  groceries_data:
